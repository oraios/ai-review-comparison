# Route maintainer labels and /review comments to a workflow on main.
name: Route PR review request
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  route:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize the requester and dispatch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const workflows = {
              'review:claude': 'review-claude.yml',
              'review:copilot': 'review-copilot.yml',
              'review:opencode': 'review-opencode.yml',
            };
            const comment = context.payload.comment;
            const command = /^\/review[ \t]+([a-z-]+)(?:\s|$)/.exec(comment?.body || '');
            const label = comment ? `review:${command?.[1]}` : context.payload.label?.name;
            if (!Object.hasOwn(workflows, label)) return;
            const workflow_id = workflows[label];
            const pr = context.payload.pull_request ?? (await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            })).data;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name.toLowerCase() !== repo.toLowerCase()) {
              throw new Error('Only open same-repository PRs targeting main are accepted.');
            }
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(access.permission)) {
              throw new Error('The review requester must have repository write access.');
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id, ref: 'main',
              inputs: { pr_number: String(pr.number), label_run_id: String(context.runId),
                ...(comment ? { comment_id: String(comment.id) } : {}) },
            });
            core.notice(`Dispatched ${workflow_id} for PR #${pr.number}`);
