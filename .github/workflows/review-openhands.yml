# Review a selected fixture PR in the main image, validate tool evidence, then publish.
# Generated by scripts/generate-workflows.mjs; edit generator and regenerate.
name: Review / openhands
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR changing only demo/pricing.json'
        required: true
        type: string
      label_run_id:
        description: 'Internal label-router run ID; leave empty for manual runs'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: review-openhands-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      packages: read
      actions: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify actor and snapshot PR data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ROUTER_RUN_ID: ${{ inputs.label_run_id }}
          REVIEWER: openhands
        run: node scripts/prepare-pr.mjs
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve main image to verified digest
        id: image
        run: node scripts/resolve-image.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openhands-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/input/*.json
          retention-days: 7
          if-no-files-found: error
  review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pull-requests: read
      packages: read
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      REVIEW_IMAGE: ${{ needs.prepare.outputs.image }}
      LLM_MODEL: ${{ vars.OPENHANDS_MODEL }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openhands-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/review-input
      - name: Prepare trusted MCP configuration and fixture
        run: node /opt/review-demo/scripts/prepare-run.mjs openhands /tmp/review-input/input.json /tmp/review-run
      - name: Check required credential
        env:
          DEMO_CREDENTIAL: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$DEMO_CREDENTIAL" ]; then
            echo 'BLOCKED: AUTH_MISSING — configure LLM_API_KEY'
            exit 1
          fi
      - name: OpenHands SDK (explicit API-funded mode)
        id: agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python /opt/review-demo/reviewers/openhands/run.py /tmp/review-run
      - name: Validate evidence (never claims PASS before publication)
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: node /opt/review-demo/scripts/finalize.mjs /tmp/review-run
      - name: Upload only reviewed evidence files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openhands-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/review-run/result.json
            /tmp/review-run/environment.json
            /tmp/review-run/review.json
            /tmp/review-run/mcp.jsonl
            /tmp/review-run/checks.json
            /tmp/review-run/smoke.png
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openhands-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish
      - name: Revalidate commit and publish independent PR review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWER: openhands
        run: node scripts/publish.mjs artifacts/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openhands-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish/published.json
          retention-days: 30
          if-no-files-found: error
