# Claude Code Action in its native interactive mode: mention @claude in a PR comment,
# a review comment or a review. The comment is the prompt; the action checks write access,
# checks out the PR head and answers in the same conversation or thread.
name: Review / claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
concurrency:
  group: review-claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  image:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/review-env:main" >> "$GITHUB_OUTPUT"
  claude:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      packages: read
      actions: read
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configure Serena for the checked-out project
        shell: bash
        run: |
          jq -n --arg project "$GITHUB_WORKSPACE" '{mcpServers: {serena: {
            command: "/opt/serena-venv/bin/serena",
            args: ["start-mcp-server", "--project", $project, "--context", "claude-code",
                   "--enable-web-dashboard", "false", "--open-web-dashboard", "false",
                   "--enable-gui-log-window", "false", "--log-level", "ERROR"]}}}' > /tmp/serena-mcp.json
      - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          path_to_claude_code_executable: /opt/review-demo/image/agents/node_modules/.bin/claude
          path_to_bun_executable: /opt/review-demo/image/agents/node_modules/.bin/bun
          claude_args: >-
            --model claude-sonnet-5-5 --effort medium
            --mcp-config /tmp/serena-mcp.json
            --allowedTools Bash,mcp__serena,mcp__github_inline_comment__create_inline_comment
            --append-system-prompt "You are a pull request reviewer. Follow review/INSTRUCTIONS.md.
            Navigate code with the Serena symbolic tools and run the project's checks (npm ci, npm test, npm run check, npm run smoke) when they help.
            Attach line-specific findings with mcp__github_inline_comment__create_inline_comment (confirmed: true) and put the summary in your comment.
            Do not commit or push."
