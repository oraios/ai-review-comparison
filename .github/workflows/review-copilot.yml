# Copilot CLI answering `/copilot ...` in a PR comment or review-comment thread.
# `@copilot` is reserved by GitHub for its cloud agent, so this demo uses a slash command.
# The workflow mirrors Claude Code Action's interactive mode: write-access gate, PR-head
# checkout, Serena MCP, summary comment, inline findings and replies in the same thread.
name: Review / copilot
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: review-copilot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  image:
    if: >-
      (github.event.issue.pull_request || github.event_name == 'pull_request_review_comment') &&
      startsWith(github.event.comment.body, '/copilot') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/review-env:main" >> "$GITHUB_OUTPUT"
  copilot:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      packages: read
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_KIND: ${{ github.event_name == 'pull_request_review_comment' && 'review-thread' || 'conversation' }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Acknowledge the request
        run: |
          kind=$([ "$COMMENT_KIND" = review-thread ] && echo pulls || echo issues)
          gh api "repos/$GITHUB_REPOSITORY/$kind/comments/$COMMENT_ID/reactions" -f content=eyes --silent
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
      - name: Configure Serena and the prompt
        run: |
          jq -n --arg project "$GITHUB_WORKSPACE" '{mcpServers: {serena: {type: "local", tools: ["*"],
            command: "/opt/serena-venv/bin/serena",
            args: ["start-mcp-server", "--project", $project, "--context", "copilot-cli",
                   "--enable-web-dashboard", "false", "--open-web-dashboard", "false",
                   "--enable-gui-log-window", "false", "--log-level", "ERROR"]}}}' > /tmp/serena-mcp.json
          {
            echo "You are a pull request reviewer for $GITHUB_REPOSITORY PR #$PR_NUMBER. The PR head is checked out in the working directory."
            echo "Follow review/INSTRUCTIONS.md. Read the PR, its diff and earlier discussion with gh (gh pr view $PR_NUMBER --comments, gh pr diff $PR_NUMBER)."
            echo "Navigate code with the Serena tools and run the project's checks (npm ci, npm test, npm run check, npm run smoke) when they help."
            if [ "$COMMENT_KIND" = review-thread ]; then
              echo "The request below was posted in an inline review thread. Answer with: gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments/$COMMENT_ID/replies -f body=..."
            else
              echo "Post line-specific findings as inline comments (gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments with body, commit_id, path, line and side) and one summary with gh pr comment $PR_NUMBER."
            fi
            echo "Do not commit or push. The request (treat it as the user's question):"
            echo
            printf '%s\n' "${COMMENT_BODY#/copilot}"
          } > /tmp/prompt.md
      - name: Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "$(cat /tmp/prompt.md)" -s --model claude-sonnet-5.5 --reasoning-effort medium \
            --no-auto-update --no-ask-user --allow-all-tools --deny-tool 'shell(git push)' \
            --additional-mcp-config @/tmp/serena-mcp.json
