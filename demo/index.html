<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parcel / shipping review fixture</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; color: #18342d; background: #f3f1e8; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 660px); background: #fffefa; border: 1px solid #dcded1; border-radius: 24px; padding: 48px; box-shadow: 0 20px 60px #18342d0b; }
    .eyebrow { font: 600 12px ui-monospace, monospace; letter-spacing: .12em; color: #65776c; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 6vw, 46px); font-weight: 550; letter-spacing: -.05em; margin: 22px 0 12px; }
    p { line-height: 1.6; color: #65776c; } label { display: block; margin: 30px 0 10px; font-weight: 600; }
    .controls { display: flex; gap: 12px; } input { min-width: 0; width: 100%; border: 1px solid #cad3c6; padding: 14px; border-radius: 9px; font: inherit; }
    button { border: 0; background: #254d3c; color: #fff; padding: 14px 24px; border-radius: 9px; font: inherit; cursor: pointer; }
    button:hover { background: #38694e; } output { display: block; margin-top: 28px; padding: 22px; background: #eef3e9; border-radius: 12px; font-size: 22px; }
    footer { margin-top: 30px; border-top: 1px solid #e3e5db; padding-top: 20px; font-size: 12px; color: #65776c; }
    @media (max-width: 480px) { main { padding: 28px; } .controls { flex-direction: column; } }
  </style>
</head>
<body><main>
  <div class="eyebrow">Parcel &nbsp;/&nbsp; AI review fixture</div>
  <h1>A small change.<br>A measurable regression.</h1>
  <p>Shipping costs $4.99. Orders of $50 or more ship free.<br>Try an order just below the threshold.</p>
  <form id="quote-form"><label for="subtotal">Order subtotal ($)</label><div class="controls">
    <input id="subtotal" type="number" min="0" max="10000" step="0.01" value="49.99" required>
    <button type="submit">Calculate</button>
  </div></form>
  <output id="result" aria-live="polite">Your shipping quote will appear here.</output>
  <footer>One pricing change. The same tests, browser and MCP tools for every reviewer.</footer>
</main><script>
  document.querySelector('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const cents = Math.round(Number(document.querySelector('input').value) * 100);
    const response = await fetch('/api/quote?subtotal=' + cents);
    const result = await response.json();
    document.querySelector('output').textContent = response.ok
      ? 'Shipping: $' + (result.shippingCents / 100).toFixed(2) + ' · Total: $' + (result.totalCents / 100).toFixed(2)
      : result.error;
  });
</script></body></html>
